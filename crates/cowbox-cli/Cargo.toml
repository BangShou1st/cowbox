[package]
name = "cowbox-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Command-line interface for cowbox"
keywords = ["cli", "sandbox", "copy-on-write", "ai-agents", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "cowbox"
path = "src/main.rs"

[dependencies]
chrono.workspace = true
clap.workspace = true
cowbox-core = { path = "../cowbox-core" }
cowbox-dag = { path = "../cowbox-dag" }
fs2.workspace = true
hex.workspace = true
humantime.workspace = true
include_dir = "0.7"
semver = "1"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(windows)'.dependencies]
ureq = { version = "2", default-features = false, features = ["json", "native-tls"] }

[target.'cfg(not(windows))'.dependencies]
ureq = { version = "2", default-features = false, features = ["json", "tls"] }

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile.workspace = true

[lints]
workspace = true
