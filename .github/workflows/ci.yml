name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-lint-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-lint-

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build all targets
        run: cargo check --workspace --all-targets

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.os }}-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.os }}-test-

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Enable unprivileged user namespaces
        run: |
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          unshare -rm echo "user namespace: ok"
          grep -w overlay /proc/filesystems

      - name: Workspace tests
        run: cargo test --workspace

      - name: Adversarial sandbox suite
        env:
          COWBOX_REQUIRE_SANDBOX: "1"
        run: cargo test -p cowbox-core --test adversarial_suite -- --test-threads=1

      - name: CLI smoke
        run: |
          cargo build -p cowbox-cli
          BIN="$GITHUB_WORKSPACE/target/debug/cowbox"
          "$BIN" --version
          "$BIN" doctor --json
          mkdir -p /tmp/cowbox-ci
          cd /tmp/cowbox-ci
          "$BIN" init
          "$BIN" run --json -- true

  benchmarks:
    name: benchmark compile / smoke
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-bench-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-bench-

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Compile benchmarks
        run: |
          if [ -f crates/cowbox-core/benches/engine.rs ]; then
            cargo bench -p cowbox-core --bench engine --no-run
          else
            echo "benchmark target is not present yet; M1 verifier must add it before release"
            exit 1
          fi
